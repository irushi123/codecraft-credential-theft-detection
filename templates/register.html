<!DOCTYPE html>
<html>
<head>
    <title>CodeCraft - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-box">
        <h2>Code<span style="color:#1e5fd9;">Craft</span></h2>
        <form method="POST">
            <input type="text" name="first_name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required minlength="8">
            <p style="font-size:12px; color:#8b94a8; text-align:left; margin:-8px 0 14px;">
                Min 8 characters, must include a letter, number, and special character.
            </p>
            <select name="role" required>
                <option value="Student">Student</option>
                <option value="Admin">Admin</option>
            </select>
            <button type="submit">Register</button>
        </form>
        {% if message %}
            <div class="message">{{ message }}</div>
        {% endif %}
        <p style="margin-top:16px; font-size:13px;">
            <a href="/login">Already have an account? Login</a>
        </p>
    </div>
</body>
</html>
