<!DOCTYPE html>
<html>
<head>
    <title>CodeCraft - Admin Verification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-box">
        <h2>Code<span style="color:#1e5fd9;">Craft</span></h2>
        <p style="color:#8b94a8; font-size:13px; margin-bottom:20px;">
            A verification code has been sent to your registered email.
            Enter it below to complete login.
        </p>
        <form method="POST">
            <input type="text" name="otp_code" placeholder="6-digit Verification Code" maxlength="6" required autofocus>
            <button type="submit">Verify &amp; Login</button>
        </form>
        {% if message %}
            <div class="message">{{ message }}</div>
        {% endif %}
        <p style="margin-top:16px; font-size:13px;">
            <a href="/login">Back to Login</a>
        </p>
    </div>
</body>
</html>
