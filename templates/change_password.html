<!DOCTYPE html>
<html>
<head>
    <title>CodeCraft - Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-wrapper">
        <div class="sidebar">
            <div class="brand">Code<span>Craft</span></div>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/profile">My Profile</a>
                <a href="/login-history">Login History</a>
                <a href="/change-password" class="active">Change Password</a>
                <a href="/feedback">Feedback</a>
                <a href="/logout">Logout</a>
            </nav>
        </div>

        <div class="main-content">
            <h2>Change Password</h2>
            <p class="subtitle">Update your account password securely</p>

            <div class="content-card" style="max-width:420px;">
                <form method="POST">
                    <input type="password" name="current_password" placeholder="Current Password" required
                           style="width:100%; padding:12px 14px; margin-bottom:14px; border:1px solid #4a4f5e; border-radius:6px; background:#2b2f3a; color:#fff;">
                    <input type="password" name="new_password" placeholder="New Password" required minlength="8"
                           style="width:100%; padding:12px 14px; margin-bottom:14px; border:1px solid #4a4f5e; border-radius:6px; background:#2b2f3a; color:#fff;">
                    <input type="password" name="confirm_password" placeholder="Confirm New Password" required minlength="8"
                           style="width:100%; padding:12px 14px; margin-bottom:14px; border:1px solid #4a4f5e; border-radius:6px; background:#2b2f3a; color:#fff;">
                    <p style="font-size:12px; color:#9aa4b8; margin-bottom:14px;">
                        Min 8 characters, must include a letter, number, and special character.
                    </p>
                    <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">Update Password</button>
                </form>
                {% if message %}
                    <div class="message">{{ message }}</div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
