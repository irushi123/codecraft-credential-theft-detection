<!DOCTYPE html>
<html>
<head>
    <title>CodeCraft - Export Data</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-wrapper">
        <div class="sidebar">
            <div class="brand"><span class="logo-mark">⬡</span>CodeCraft</div>
            <nav>
                <a href="/admin">Dashboard</a>
                <a href="/admin/login-attempts">Login Attempts</a>
                <a href="/admin/risk-scores">Risk Scores</a>
                <a href="/admin/explanations">Explanation Summary</a>
                <a href="/admin/alerts">Security Alerts</a>
                <a href="/admin/users">Manage Users</a>
                <a href="/admin/audit-log">Audit Log</a>
                <a href="/admin/export-form" class="active">Export Data</a>
                <a href="/admin/reports">Generate Reports</a>
                <a href="/logout">Logout</a>
            </nav>
        </div>

        <div class="main-content">
            <h2>Export Data</h2>
            <p class="subtitle">Download login attempt records as a CSV file</p>

            <div class="content-card" style="max-width:480px;">
                <form method="GET" action="/admin/export">
                    <label style="display:block; color:#9aa4b8; font-size:13px; margin-bottom:6px;">Start Date (optional)</label>
                    <input type="date" name="start_date" style="width:100%; padding:10px; margin-bottom:16px; border-radius:6px; border:1px solid #4a4f5e; background:#2b2f3a; color:#dbe4f0;">

                    <label style="display:block; color:#9aa4b8; font-size:13px; margin-bottom:6px;">End Date (optional)</label>
                    <input type="date" name="end_date" style="width:100%; padding:10px; margin-bottom:16px; border-radius:6px; border:1px solid #4a4f5e; background:#2b2f3a; color:#dbe4f0;">

                    <label style="display:block; color:#9aa4b8; font-size:13px; margin-bottom:6px;">Risk Level (optional)</label>
                    <select name="risk_level" style="width:100%; padding:10px; margin-bottom:20px; border-radius:6px; border:1px solid #4a4f5e; background:#2b2f3a; color:#dbe4f0;">
                        <option value="">All</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>

                    <button type="submit" class="btn btn-primary" style="width:100%;">Download CSV</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
