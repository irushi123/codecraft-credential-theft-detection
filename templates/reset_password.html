<!DOCTYPE html>
<html>
<head>
    <title>CodeCraft - Reset Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .password-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .password-wrapper input {
            width: 100%;
            box-sizing: border-box;
            padding-right: 65px;
            margin-bottom: 0;
        }

        .show-password {
            position: absolute !important;
            right: 8px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;

            width: auto !important;
            min-width: 42px !important;
            height: auto !important;

            padding: 4px 5px !important;
            margin: 0 !important;

            border: none !important;
            outline: none !important;
            background: transparent !important;

            color: #1e5fd9 !important;
            cursor: pointer !important;

            font-size: 12px !important;
            font-weight: 500 !important;

            box-shadow: none !important;
        }

        .show-password:hover {
            color: #174ca8 !important;
            background: transparent !important;
            box-shadow: none !important;
        }

        .info-text {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .back-link {
            margin-top: 15px;
            text-align: center;
        }

        .back-link a {
            color: #1e5fd9;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d0d7e2;
            border-radius: 6px;
            font-size: 14px;
            color: #1a1a2e;
            background-color: #ffffff;
            box-sizing: border-box;
        }

        .auth-box input:focus {
            outline: none;
            border-color: #4dabf7;
        }

        .auth-box button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #1e5fd9;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }

        .auth-box button[type="submit"]:hover {
            background-color: #164ab0;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff3cd;
            color: #664d03;
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-bottom: 14px;
            line-height: 1.4;
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-box">

        <h2>
            Code<span style="color:#1e5fd9;">Craft</span>
        </h2>

        <h3>Reset Password</h3>

        <p class="info-text">
            Enter the verification code sent to your email
            and create a new password.
        </p>

        <form method="POST">

            <!-- Email -->
            <input
                type="email"
                name="email"
                value="{{ email or '' }}"
                placeholder="Email"
                required
            >

            <!-- OTP -->
            <input
                type="text"
                name="otp_code"
                placeholder="Verification Code"
                maxlength="6"
                required
            >

            <!-- New Password -->
            <div class="password-wrapper">

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="New Password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="toggleNewPassword()"
                    id="showNewPasswordBtn">
                    Show
                </button>

            </div>

            <!-- Confirm Password -->
            <div class="password-wrapper">

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm New Password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="toggleConfirmPassword()"
                    id="showConfirmPasswordBtn">
                    Show
                </button>

            </div>

            <div class="password-requirements">
                ⚠️ Min 8 characters, must include a letter, number, and special character.
            </div>

            <!-- Reset Password -->
            <button type="submit">
                Reset Password
            </button>

        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <div class="back-link">
            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>
        </div>

    </div>

    <script>

        function toggleNewPassword() {
            const input = document.getElementById("new_password");
            const button = document.getElementById("showNewPasswordBtn");

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "Hide";
            } else {
                input.type = "password";
                button.textContent = "Show";
            }
        }

        function toggleConfirmPassword() {
            const input = document.getElementById("confirm_password");
            const button = document.getElementById("showConfirmPasswordBtn");

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "Hide";
            } else {
                input.type = "password";
                button.textContent = "Show";
            }
        }

    </script>

</body>
</html>
