
<!DOCTYPE html>
<html>
<head>
    <title>CodeCraft - Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .password-container {
            width: 100%;
        }

        .password-container input[type="password"],
        .password-container input[type="text"] {
            width: 100%;
            box-sizing: border-box;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
        }

        .show-password input[type="checkbox"] {
            width: auto;
            margin: 0;
            cursor: pointer;
        }

        .forgot-password {
            margin-top: 8px;
            font-size: 13px;
        }

        .forgot-password a {
            color: #1e5fd9;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-box">

        <h2>
            Code<span style="color:#1e5fd9;">Craft</span>
        </h2>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <label class="show-password">
                    <input
                        type="checkbox"
                        onclick="togglePassword()"
                    >
                    Show Password
                </label>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <p class="forgot-password">
            <a href="{{ url_for('forgot_password') }}">
                Forgot Password?
            </a>
        </p>

        <p style="margin-top:16px; font-size:13px;">
            <a href="/register">
                Don't have an account? Register
            </a>
        </p>

        <p style="margin-top:8px; font-size:13px;">
            <a href="/">
                Back to Home
            </a>
        </p>

    </div>

    <script>
        function togglePassword() {

            const password =
                document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        }
    </script>

</body>
</html>
