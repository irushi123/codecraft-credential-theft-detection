<!DOCTYPE html>
<html>
<head>
    <title>CodeCraft - Edit Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-wrapper">
        <div class="sidebar">
            <div class="brand">Code<span>Craft</span></div>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/profile" class="active">My Profile</a>
                <a href="/change-password">Change Password</a>
                <a href="/feedback">Feedback</a>
                <a href="/logout">Logout</a>
            </nav>
        </div>

        <div class="main-content">
            <h2>Edit Profile</h2>
            <p class="subtitle">Update your personal information and profile picture</p>

            <div class="content-card" style="max-width:480px;">
                {% if user.Profile_image %}
                    <img src="{{ url_for('static', filename='uploads/' + user.Profile_image) }}"
                         style="width:90px; height:90px; border-radius:50%; object-fit:cover; margin-bottom:16px; display:block;">
                {% endif %}

                <form method="POST" enctype="multipart/form-data">
                    <label style="font-size:13px; color:#9aa4b8;">Full Name</label>
                    <input type="text" name="first_name" value="{{ user.First_name }}" required
                        style="width:100%; padding:12px 14px; margin:6px 0 14px; border:1px solid #4a4f5e; border-radius:6px; background:#2b2f3a; color:#fff;">

                    <label style="font-size:13px; color:#9aa4b8;">Email</label>
                    <input type="email" name="email" value="{{ user.Email }}" required
                        style="width:100%; padding:12px 14px; margin:6px 0 14px; border:1px solid #4a4f5e; border-radius:6px; background:#2b2f3a; color:#fff;">

                    <label style="font-size:13px; color:#9aa4b8;">Profile Picture</label>
                    <input type="file" name="profile_image" accept=".png,.jpg,.jpeg"
                        style="width:100%; padding:10px 0; margin:6px 0 14px; color:#fff;">

                    <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">Save Changes</button>
                </form>
                {% if message %}
                    <div class="message">{{ message }}</div>
                {% endif %}
            </div>

            <a href="/profile" class="btn" style="margin-top:12px; display:inline-block; color:#4dabf7;">← Back to Profile</a>
        </div>
    </div>
</body>
</html>
