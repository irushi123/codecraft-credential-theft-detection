<!DOCTYPE html>
<html>
<head>
    <title>CodeCraft - Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .auth-box p {
            font-size: 13px;
        }

        .info-text {
            color: #666;
            font-size: 13px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .back-link {
            margin-top: 15px;
            text-align: center;
        }

        .back-link a {
            color: #1e5fd9;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 14px;
            border: 1px solid #d0d7e2;
            border-radius: 6px;
            font-size: 14px;
            color: #1a1a2e;
            background-color: #ffffff;
            box-sizing: border-box;
        }

        .auth-box input:focus {
            outline: none;
            border-color: #4dabf7;
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            background-color: #1e5fd9;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .auth-box button:hover {
            background-color: #164ab0;
        }

        .message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff3cd;
            color: #664d03;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-box">

        <h2>
            Code<span style="color:#1e5fd9;">Craft</span>
        </h2>

        <h3>Forgot Password?</h3>

        <p class="info-text">
            Enter your registered email address.
            We will send you a verification code.
        </p>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit">
                Send Verification Code
            </button>

        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <div class="back-link">
            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>
        </div>

    </div>

</body>
</html>
