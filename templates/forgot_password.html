<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodeCraft - Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        
        .dash.login-dash {
            min-height: 100vh; margin: 0; padding: 24px;
            display: grid; place-items: center;
            background: var(--bg, var(--surface));
            color: var(--text);
        }
        .dash .login-wrap { width: 100%; max-width: 420px; }

        .dash .login-brand {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 20px;
        }
        .dash .login-brand .brand-logo {
            width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
            background: var(--hover); color: var(--accent); flex: none;
        }
        .dash .login-brand .brand-logo svg { width: 22px; height: 22px; }
        .dash .login-brand .brand-text { font-size: 22px; font-weight: 700; color: var(--text); }
        .dash .login-brand .brand-text span { color: var(--accent); }

        .dash .login-card { margin: 0; padding: 28px 24px; }
        .dash .login-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
        .dash .login-head .ico {
            width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center;
            background: var(--hover); color: var(--accent); flex: none;
        }
        .dash .login-head .ico svg { width: 18px; height: 18px; }
        .dash .login-head h3 { margin: 0; font-size: 16px; }

        .dash .set-rule {
            display: flex; align-items: center; gap: 8px;
            margin: 12px 0 20px; padding: 10px 12px; border-radius: 8px;
            background: var(--hover); border: 1px solid var(--border);
            font-size: 13px; color: var(--muted); line-height: 1.5;
        }
        .dash .set-rule svg { width: 15px; height: 15px; flex: none; }

        .dash .notice {
            display: flex; align-items: center; gap: 10px;
            margin: 0 0 16px; padding: 12px 16px;
            border-left: 4px solid var(--accent); color: var(--text); font-size: 14px;
        }
        .dash .notice svg { width: 18px; height: 18px; color: var(--accent); flex: none; }

        .dash .login-form { display: flex; flex-direction: column; gap: 16px; margin: 0; }
        .dash .field { display: flex; flex-direction: column; gap: 6px; }
        .dash .field label { font-size: 13px; font-weight: 600; color: var(--text); }
        .dash .field input {
            width: 100%; height: 42px; padding: 0 12px; box-sizing: border-box;
            border: 1px solid var(--border); border-radius: 8px;
            background: var(--surface); color: var(--text);
            font: inherit; font-size: 14px;
        }
        .dash .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

        .dash .login-actions .btn {
            margin: 0; width: 100%; height: 44px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .dash .login-actions .btn svg { width: 16px; height: 16px; }

        .dash .login-links {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            margin-top: 20px; font-size: 13px;
        }
        .dash .login-links a { color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .dash .login-links a:hover { text-decoration: underline; }
        .dash .login-links a svg { width: 14px; height: 14px; }
    </style>
</head>
<body class="dash login-dash">

    <div class="login-wrap">
        <div class="login-brand">
            <div class="brand-logo"><i data-lucide="shield-check"></i></div>
            <div class="brand-text">Code<span>Craft</span></div>
        </div>

        <div class="content-card login-card">
            <div class="login-head">
                <div class="ico"><i data-lucide="key-round"></i></div>
                <h3>Forgot Password?</h3>
            </div>

            <div class="set-rule">
                <i data-lucide="info"></i>
                <span>Enter your registered email address. We will send you a verification code.</span>
            </div>

            {% if message %}
            <div class="content-card notice">
                <i data-lucide="info"></i><span>{{ message }}</span>
            </div>
            {% endif %}

            <form method="POST" class="login-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" placeholder="Enter your registered email" required autocomplete="email">
                </div>

                <div class="login-actions">
                    <button type="submit" class="btn btn-primary"><i data-lucide="send"></i>Send Verification Code</button>
                </div>
            </form>

            <div class="login-links">
                <a href="{{ url_for('login') }}"><i data-lucide="arrow-left"></i>Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        if (window.lucide) { lucide.createIcons(); }
    </script>
</body>
</html>
