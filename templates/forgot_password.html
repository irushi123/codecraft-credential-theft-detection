<!DOCTYPE html>
<html>
<head>
    <title>CodeCraft - Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .auth-box p {
            font-size: 13px;
        }

        .info-text {
            color: #666;
            font-size: 13px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .back-link {
            margin-top: 15px;
            text-align: center;
        }

        .back-link a {
            color: #1e5fd9;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body class="auth-page">

    <div class="auth-box">

        <h2>
            Code<span style="color:#1e5fd9;">Craft</span>
        </h2>

        <h3>Forgot Password?</h3>

        <p class="info-text">
            Enter your registered email address.
            We will send you a verification code.
        </p>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >

            <button type="submit">
                Send Verification Code
            </button>

        </form>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <div class="back-link">
            <a href="{{ url_for('login') }}">
                ← Back to Login
            </a>
        </div>

    </div>

</body>
</html>
